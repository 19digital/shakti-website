name: Keep site awake

# Render's free plan puts the service to sleep after 15 minutes without visitors, and the next visitor
# then sees Render's "waking up" screen. This pings /healthz every 5 minutes so that never happens.
# (GitHub may start scheduled runs a few minutes late; a second monitor such as UptimeRobot is a good backup.)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: |
          curl --silent --show-error --fail --location --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://shaktiew.in/healthz
